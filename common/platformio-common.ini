; Shared PlatformIO configuration for heater-system.
; Included by both boiler-room/platformio.ini and home-heating/platformio.ini via
; `extra_configs = ../common/platformio-common.ini`. All relative paths below
; (symlink://, extra_scripts, lib_extra_dirs) resolve against the *including*
; project's directory. boiler-room/ and home-heating/ are both siblings of
; common/, so the same relative strings (`../common/...`) are valid from either
; project.

[heater_common]
build_flags_base =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -std=gnu++17

arduino_lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    olikraus/U8g2
    ottowinter/AsyncMqttClient-esphome
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson
    ayushsharma82/ElegantOTA

shared_lib_deps =
    symlink://../common/lib/BoardConfig
    symlink://../common/lib/RelayBoot
    symlink://../common/lib/CoreEngine
    symlink://../common/lib/HwEngine
    symlink://../common/lib/NetEngine
    symlink://../common/lib/WebEngine
    symlink://../common/lib/CoreEsp32
    symlink://../common/lib/HwEsp32
    symlink://../common/lib/NetEsp32
    symlink://../common/lib/WebEsp32

[env:release]
platform               = espressif32
board                  = esp32dev
framework               = arduino
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed           = 115200
upload_speed             = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ${heater_common.build_flags_base}

lib_deps =
    ${heater_common.arduino_lib_deps}
    ${heater_common.shared_lib_deps}

lib_ignore =
    AsyncTCP-esphome

build_unflags =
    -std=gnu++11

extra_scripts =
    pre:../common/scripts/fw_version.py
    pre:../common/scripts/web_assemble.py

[env:debug]
extends     = env:release
build_flags =
    -DCORE_DEBUG_LEVEL=4
    ${heater_common.build_flags_base}
    -DDEBUG_BUILD

[env:native]
platform = native
build_flags =
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson
    symlink://../common/lib/BoardConfig
    symlink://../common/lib/CoreEngine
    symlink://../common/lib/HwEngine
    symlink://../common/lib/NetEngine
    symlink://../common/lib/WebEngine
test_build_src = no
